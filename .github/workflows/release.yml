name: 🚀 Release Build

# Builds Null installers on every version tag and attaches them to the GitHub Release.
# How to cut a release (see AGENTS.md):
#   npm version patch   # or: minor / major  -> bumps package.json + creates local tag
#   git push --follow-tags
# Or manually: git tag v1.2.3 && git push origin v1.2.3
# Manual run (workflow_dispatch) only builds — it does NOT publish a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release from this run? (default: build only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write # needed to create releases + upload installers + update CHANGELOG.md

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so changelog generation can diff against previous tag

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🐧 Install Linux packaging deps (deb/rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm zip dpkg-dev

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: 🏭 Make installers (electron-forge)
        run: npm run make
        env:
          # Squirrel.Windows code-signing (optional — skipped if secrets are absent)
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: 📋 List build output
        run: |
          echo "=== out/make ==="
          find out/make -type f | head -n 50 || ls -R out/make
        shell: bash

      - name: ⬆️ Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: null-${{ runner.os }}-${{ github.ref_name }}
          path: |
            out/make/**/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 🎉 Publish GitHub Release
    # Tag pushes always publish. Manual runs publish only when publish == 'true'.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true'
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Download all installers
        uses: actions/download-artifact@v4
        with:
          path: ./dist-installers

      - name: 📋 List downloaded installers
        run: find ./dist-installers -type f | sort

      - name: 📝 Generate emoji changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          CUR_TAG="${GITHUB_REF_NAME}"
          # Manual dispatch has no tag — fall back to latest tag / package.json version
          # (kept as flat statements: triple-nested "$(.. "$(.. "..")")" is a bash parse error)
          if [ -z "$CUR_TAG" ] || [ "$CUR_TAG" = "main" ] || [ "$CUR_TAG" = "master" ]; then
            CUR_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -z "$CUR_TAG" ]; then
              CUR_TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          echo "Current tag: $CUR_TAG"
          PREV_TAG="$(git tag --sort=-v:refname | grep -x 'v.*' | grep -v -x "$CUR_TAG" | head -n 1 || true)"
          echo "Previous tag: ${PREV_TAG:-<none>}"
          RANGE="$CUR_TAG"
          if [ -n "${PREV_TAG:-}" ]; then RANGE="$PREV_TAG..$CUR_TAG"; fi
          echo "Range: $RANGE"
          # Map the top human author to the repo owner login so mentions render:
          # git %an is a display name ("Abdalla Ahmed"), not a GitHub @handle.
          OWNER="$(git config --get remote.origin.url 2>/dev/null | sed -E 's#.*github\.com[:/]([^/]+)/.*#\1#')"
          TOP_AUTHOR="$(git log "$RANGE" --pretty='%an' 2>/dev/null | sort | uniq -c | sort -rn | head -n 1 | sed -E 's/^ +[0-9]+ //')"
          ESCAPED_AUTHOR="$(printf '%s' "$TOP_AUTHOR" | sed 's/[][\.*^$/]/\\&/g')"
          echo "Mention mapping: @${TOP_AUTHOR:-<none>} -> @${OWNER:-<none>}"

          {
            echo "## What's Changed"
            echo ""
            if [ -n "${PREV_TAG:-}" ]; then
              echo "_Full diff: \`$PREV_TAG → $CUR_TAG\`_"
              echo ""
            fi
            for section in "feat:✨ Features" "fix:🐛 Bug Fixes" "sec:🔒 Security & Privacy" "perf:⚡ Performance" "refactor:♻️ Refactors" "docs:📝 Docs" "style:💄 UI & Style" "test:✅ Tests" "chore:🔧 Chores" "other:📌 Other"; do
              prefix="${section%%:*}"; title="${section#*:}"
              case "$prefix" in
                feat)     pat='^(feat|feature|enhancement)(\(|:|!)' ;;
                fix)      pat='^(fix|bugfix|hotfix|bug)(\(|:|!)' ;;
                sec)      pat='^(sec|security|privacy)(\(|:|!)' ;;
                perf)     pat='^(perf|performance|optim)(\(|:|!)' ;;
                refactor) pat='^(refactor)(\(|:|!)' ;;
                docs)     pat='^(docs|documentation)(\(|:|!)' ;;
                style)    pat='^(style|ui|design|theme)(\(|:|!)' ;;
                test)     pat='^(test|tests)(\(|:|!)' ;;
                chore)    pat='^(chore|build|ci)(\(|:|!)' ;;
                *)        pat='' ;;
              esac
              if [ "$prefix" = "other" ]; then
                commits="$(git log "$RANGE" --pretty='- %s (%h by @%an)' 2>/dev/null | grep -v -i -E '^- (feat|feature|enhancement|fix|bugfix|hotfix|bug|sec|security|privacy|perf|performance|optim|refactor|docs|documentation|style|ui|design|theme|test|tests|chore|build|ci)(\(|:|!)' || true)"
              else
                commits="$(git log "$RANGE" --pretty='- %s (%h by @%an)' 2>/dev/null | grep -i -E "^- $pat" || true)"
              fi
              if [ -n "$commits" ]; then
                echo "### $title"
                if [ -n "${OWNER:-}" ] && [ -n "${TOP_AUTHOR:-}" ] && [ "$TOP_AUTHOR" != "$OWNER" ]; then
                  printf '%s\n' "$commits" | sed "s/@${ESCAPED_AUTHOR}/@${OWNER}/g"
                else
                  echo "$commits"
                fi
                echo ""
              fi
            done
            echo "---"
            echo ""
            echo "### 📦 Install"
            echo ""
            echo "| OS | File | |"
            echo "|----|------|-|"
            echo "| 🪟 Windows | \`*-Setup.exe\` / \`.nupkg\` | Run the Setup, or \`npx electron-forge publish\` output |"
            echo "| 🍎 macOS | \`.zip\` | Unzip → drag **Null** to Applications |"
            echo "| 🐧 Linux | \`.deb\` / \`.rpm\` | \`sudo dpkg -i null*.deb\` or \`sudo rpm -i null*.rpm\` |"
            echo ""
            echo "> 🛡️ Null forgets everything when it closes. No telemetry, no account, no cloud."
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md
          echo "tag=$CUR_TAG" >> "$GITHUB_OUTPUT"

      - name: 🎉 Create / update GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Null ${{ github.ref_name }}'
          body_path: RELEASE_NOTES.md
          generate_release_notes: true # appends GitHub-native notes (uses .github/release.yml emoji categories)
          append_body: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta.1 -> prerelease
          fail_on_unmatched_files: false
          files: |
            dist-installers/**/*.exe
            dist-installers/**/*.nupkg
            dist-installers/**/*.RELEASES
            dist-installers/**/*.zip
            dist-installers/**/*.dmg
            dist-installers/**/*.deb
            dist-installers/**/*.rpm

      - name: 📚 Update CHANGELOG.md on main
        shell: bash
        run: |
          set -euo pipefail
          # Commit as the tag pusher (not github-actions[bot]) so the
          # contributors graph stays single-author.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          TAG="${{ github.ref_name }}"
          DATE="$(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin main
            BASE="$(git show origin/main:CHANGELOG.md 2>/dev/null || true)"
            if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -qF "## $TAG "; then
              echo "CHANGELOG on main already contains $TAG — nothing to do."
              exit 0
            fi
            if [ -n "$BASE" ] && [ "$(printf '%s' "$BASE" | head -n 1)" = "# 📜 Changelog" ]; then
              REST="$(printf '%s\n' "$BASE" | tail -n +4)"
            elif [ -n "$BASE" ]; then
              REST="$BASE"
            else
              REST=""
            fi
            {
              echo "# 📜 Changelog"
              echo ""
              echo "All notable changes to Null. Releases are cut from version tags (see AGENTS.md)."
              echo ""
              echo "## $TAG — $DATE"
              echo ""
              cat RELEASE_NOTES.md
              echo ""
              if [ -n "$REST" ]; then printf '%s\n' "$REST"; fi
            } > CHANGELOG.md
            # Parent the commit on origin/main (not the tag) so the push is fast-forward.
            git reset --soft origin/main
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "No CHANGELOG changes to commit."
              exit 0
            fi
            git commit -m "📝 docs: update CHANGELOG for $TAG [skip ci]"
            if git push origin HEAD:main; then
              echo "✅ CHANGELOG pushed to main."
              exit 0
            fi
            echo "⚠️ Push lost a race with another main update — retrying ($attempt/3)…"
            sleep 5
          done
          echo "❌ Could not push CHANGELOG.md to main after 3 attempts." >&2
          exit 1
